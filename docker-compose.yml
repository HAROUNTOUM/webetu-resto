# First run:   docker compose run --rm webetu setup     (matricule, password, restaurant)
# Then:        docker compose up -d
#
# Credentials and state are stored in the named volume below (/data/.env and
# /data/state.json): no file has to exist on the host, and they never appear in
# `docker inspect`.
services:
  webetu:
    build: .
    image: webetu-resto:0.1.0
    container_name: webetu-resto
    restart: unless-stopped
    init: true
    environment:
      TZ: Africa/Algiers
    volumes:
      - webetu-data:/data
    command: ["daemon"]
    stop_grace_period: 10s

volumes:
  webetu-data:
    name: webetu-resto-state
