services:
  webetu:
    build: .
    image: webetu-resto:0.1.0
    container_name: webetu-resto
    restart: unless-stopped
    init: true
    environment:
      # Persisted in the named volume below, not in the image.
      WEBETU_STATE_PATH: /data/state.json
      TZ: Africa/Algiers
    volumes:
      # The app reads /app/.env directly. Keeping credentials in a mounted file
      # (instead of `env_file`) avoids exposing them in `docker inspect`.
      - ./.env:/app/.env
      - webetu-state:/data
    command: ["daemon"]
    stop_grace_period: 10s

volumes:
  webetu-state:
    name: webetu-resto-state
